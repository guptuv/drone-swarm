[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-swarm-robotics"
version = "3.0.0"
description = "Drone swarm robotics simulator with multi-agent RL, GNNs, deep learning perception and classical robotics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Gupta" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pillow>=9.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
ai = ["torch>=2.0"]
notebook = ["ipython"]

[tool.setuptools]
packages = ["drone_swarm", "drone_swarm.ai", "drone_swarm.robotics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
